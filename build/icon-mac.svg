<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <!-- macOS app icon grid: an 824 px body centred on a 1024 px canvas, with the system-style shadow.
       The artwork is the same as src/renderer/assets/icon.svg (256 px), scaled into the body. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7bff"/>
      <stop offset="0.55" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#2f86f5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(3.21875)">
    <rect width="256" height="256" rx="57.5" fill="url(#bg)" filter="url(#shadow)"/>
    <rect width="256" height="256" rx="57.5" fill="url(#shine)"/>
    <rect x="124" y="54" width="62" height="34" rx="12" fill="#fff" fill-opacity=".42"/>
    <path d="M62 50h40a14 14 0 0 1 13 9l6 15h73a18 18 0 0 1 18 18v94a18 18 0 0 1-18 18H62a18 18 0 0 1-18-18V68a18 18 0 0 1 18-18z" fill="#fff"/>
    <g fill="none" stroke="url(#ink)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M74 166v-52l23 26 23-26v52"/>
      <path d="M162 114v50M143 146l19 20 19-20"/>
    </g>
  </g>
</svg>
